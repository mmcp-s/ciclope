; Firmware do olho do Ciclope — PlatformIO
;
; Dois ambientes, um por placa. Escolhe o teu na barra de baixo do VS Code
; (ou com `pio run -e <nome> -t upload`):
;
;   ws_touch_lcd_21  Waveshare ESP32-S3-Touch-LCD-2.1  (480×480, ST7701, PSRAM octal)
;   ws_lcd_128       Waveshare ESP32-S3-LCD-1.28       (240×240, GC9A01, PSRAM quad)
;
; Porque não o `platform = espressif32` normal: a versão estável do PlatformIO
; ainda traz o Arduino-ESP32 2.x, e a biblioteca gráfica precisa do 3.x para
; os ecrãs RGB. O pioarduino é a plataforma mantida pela comunidade com o 3.x.

[platformio]
default_envs = ws_touch_lcd_21

[env]
; Versões fixas, para a compilação ser reprodutível: foi com estas que o
; firmware foi compilado e testado (Arduino-ESP32 3.3.12, ESP-IDF 5.5.5).
; Para atualizar, muda os números à mão e volta a testar.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
lib_deps =
    moononournation/GFX Library for Arduino@1.6.9
    links2004/WebSockets@2.7.3
    bblanchon/ArduinoJson@7.4.3

[env:ws_touch_lcd_21]
; ESP32-S3R8: 8 MB de PSRAM octal (qio_opi), 16 MB de flash.
board = esp32-s3-devkitc1-n16r8
build_flags =
    -DBOARD_WS_S3_TOUCH_LCD_21
; Se usares a porta USB nativa em vez da "USB TO UART", acrescenta:
;   -DARDUINO_USB_MODE=1
;   -DARDUINO_USB_CDC_ON_BOOT=1

[env:ws_lcd_128]
; ESP32-S3R2: 2 MB de PSRAM quad (qio_qspi), 16 MB de flash.
board = esp32-s3-devkitc1-n16r2
build_flags =
    -DBOARD_WS_S3_LCD_128

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ciclope"
version = "0.1.0"
description = "Assistente de voz com um olho animado: Raspberry Pi 5 (cérebro) + ESP32-S3 (cara)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Marcela Carvalho" }]

# Núcleo: chega para a Fase 0 (escreves no teclado, o ciclope responde em voz alta).
dependencies = [
    "numpy",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "sounddevice>=0.5",
    "websockets>=15",
    "piper-tts>=1.3",
]

[project.optional-dependencies]
# Fase 1: ouvidos (palavra de ativação, deteção de fim de fala, transcrição).
voz = [
    "faster-whisper>=1.1",
    "openwakeword>=0.6",
    "webrtcvad-wheels>=2.0.14",
]
# Só no Raspberry Pi: botão e LEDs do reSpeaker.
pi = [
    "gpiozero>=2.0.1.post1",
    "lgpio>=0.2.2",
    "spidev>=3.6",
]
dev = ["pytest>=8"]

[project.scripts]
ciclope = "ciclope.main:main"

[tool.setuptools]
packages = ["ciclope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
